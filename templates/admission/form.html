{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Admission</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{
background:#eef3ff;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
width:400px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

input, textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>Student Admission</h2>

<form id="admissionForm" method="post" enctype="multipart/form-data">
{% csrf_token %}

<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone" required>
<input name="email" placeholder="Email" required>
<input name="course" placeholder="Course">
<input name="center_name" placeholder="Center">
<textarea name="address" placeholder="Address"></textarea>
<input type="password" name="password" placeholder="Password" required>
<input type="file" name="photo" required>

<button type="button" onclick="payNow()">Pay ₹300 & Submit</button>

</form>

</div>

<script>

function payNow(){

fetch("/create-order/", {
method:"POST",
headers:{
"X-CSRFToken":"{{ csrf_token }}"
}
})
.then(res=>res.json())
.then(order=>{

var options = {
key: "{{ RAZORPAY_API_KEY }}",
amount: order.amount,
currency: "INR",
order_id: order.id,

handler: function (response) {

let form = document.getElementById("admissionForm");

let hidden = document.createElement("input");
hidden.type = "hidden";
hidden.name = "razorpay_payment_id";
hidden.value = response.razorpay_payment_id;

form.appendChild(hidden);

form.submit();
}
};

var rzp = new Razorpay(options);
rzp.open();

});

}

</script>

</body>
</html>
